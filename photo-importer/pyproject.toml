[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-importer"
version = "1.0.0"
description = "Automatic Fujifilm X-T3 (and PTP camera) importer for NAS via gphoto2"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "photo-importer contributors" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
photo-importer = "photo_importer.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_importer"]

[tool.hatch.build.targets.wheel.sources]
"src/photo_importer" = "photo_importer"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
