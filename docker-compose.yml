services:
  importer:
    build: .
    container_name: photo-importer
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      # Bind mount, NOT a `devices:` entry: Docker resolves `devices:` when the
      # container is created, so a camera plugged in later never gets a node
      # inside the container and every gphoto2 open fails with error -52.
      - /dev/bus/usb:/dev/bus/usb
      # Adjust the host path to your UGREEN NAS photo library
      - /volume1/photos:/photos
      - ./config:/config
      # Persists imports.sqlite3 across container rebuilds and replacements
      - ./db:/db
      - ./logs:/logs
      - ./hooks:/hooks
      # gphotos-uploader-cli config + encrypted OAuth token (see README)
      - ./gphotos:/gphotos
    environment:
      PHOTO_IMPORTER_CONFIG: /config/config.yaml
      # Passphrase for SecretsBackendType: file (required for Google Photos upload)
      # GPHOTOS_CLI_TOKENSTORE_KEY: "change-me-to-a-long-random-string"
    # Uncomment if your NAS needs the host network for USB quirks
    # network_mode: host
